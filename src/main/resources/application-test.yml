spring:
  config:
    activate:
      on-profile: test
  datasource:
    # Parité stricte : Tests exécutés sur une vraie instance PostgreSQL (base seguros_test_db)
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:seguros_test_db}
    username: ${TEST_DB_USER:seguros_admin}
    password: ${TEST_DB_PASSWORD:seguros_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false

logging:
  level:
    com.seguros.api: DEBUG
    org.flywaydb: INFO
